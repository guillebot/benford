[project]
name = "benford-web-tester"
version = "0.1.0"
description = "Test Benford's law against numbers scraped from public web pages"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx==0.27.2",
  "beautifulsoup4==4.12.3",
  "lxml==5.3.0",
  "streamlit>=1.41.0,<2.0",
  "matplotlib==3.9.2",
  "pandas==2.2.3",
]

[tool.setuptools.packages.find]
include = ["benford*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]